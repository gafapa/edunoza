name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      production_test_grep:
        description: "Optional production browser test filter; empty runs every browser suite"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Build test deployment
        run: npm run build:test

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        if: github.event_name != 'workflow_dispatch' || inputs.production_test_grep == ''
        run: npm run test:e2e

      - name: Run built application browser tests
        if: github.event_name != 'workflow_dispatch' || inputs.production_test_grep == ''
        run: npm run test:e2e:production

      - name: Run selected built application browser tests
        if: github.event_name == 'workflow_dispatch' && inputs.production_test_grep != ''
        env:
          PRODUCTION_TEST_GREP: ${{ inputs.production_test_grep }}
        run: npm run test:e2e:production -- --grep "$PRODUCTION_TEST_GREP"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
