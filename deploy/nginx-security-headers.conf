# Include this file in the HTTPS server or location block that serves Edunoza.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.openai.com https://openrouter.ai https://api.anthropic.com http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Cache policy. Nginx drops inherited add_header directives in any location that sets its
# own, so each caching location must include this file again, for example:
#
#   location /assets/ {
#     include /etc/nginx/snippets/nginx-security-headers.conf;
#     add_header Cache-Control "public, max-age=31536000, immutable" always;
#     try_files $uri =404;
#   }
#   location = /sw.js {
#     include /etc/nginx/snippets/nginx-security-headers.conf;
#     add_header Cache-Control "no-cache" always;
#   }
#   location / {
#     include /etc/nginx/snippets/nginx-security-headers.conf;
#     add_header Cache-Control "no-cache" always;
#     try_files $uri /index.html;
#   }
#
# Only /assets/ holds content-hashed Vite output. Never long-cache index.html, sw.js,
# manifest.webmanifest, or the stable-name files under fonts/.
